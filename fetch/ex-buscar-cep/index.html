<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Buscar CEP</title>
</head>
<body>
    <form name="buscarCep" id="buscarCep">
        <label for="cep">CEP</label>
        <input type="number" name="cep" id="cep" required placeholder="Digite o CEP">
    </form>

    <span class="erro">⚠️ O CEP deve conter 8 dígitos</span>
    
    <button class="btn">Buscar Endereço</button>
    <script src="script.js"></script>
</body>
</html>
