<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Buscar CEP</title>
</head>
<body>
    <form name="buscarCep" id="buscarCep">
        <label for="cep">CEP</label>
        <input type="text" name="cep" id="cep" required placeholder="Digite o CEP">
    </form>

    <span class="erro">⚠️ O CEP deve conter este formato: 00000-000</span>
    
    <button class="btn">Buscar Endereço</button>

    <div class="resultado">
        <h1>Resultado 🗺️</h1>
        <ul class="endereco">
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
